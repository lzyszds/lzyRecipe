name: Android Release

# 打 tag（如 萌厨食光-v0.3.0）或手动触发时，构建 APK 并发布到 GitHub Releases。
# App 内的「检查更新」读取的就是这里的 Releases。
#
# 发布流程：
#   1. 本地执行 npm run android:build -- --bump=patch（或 minor/major）升级版本号
#   2. 提交并推送代码
#   3. 打 tag 并推送：git tag 萌厨食光-v0.3.0 && git push origin 萌厨食光-v0.3.0
#
# 需要在仓库 Secrets 中配置（见 README「应用更新」）：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - '萌厨食光-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（如 萌厨食光-v0.3.0），需与 package.json 版本一致'
        required: true

permissions:
  contents: write

env:
  ANDROID_TARGET: aarch64
  NODE_VERSION: '22'
  NDK_VERSION: '27.0.12077973'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        shell: bash
        run: node scripts/check-version-sync.mjs --tag "${{ steps.meta.outputs.tag }}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Locate Android SDK
        id: sdk
        shell: bash
        run: |
          # 直接使用 GitHub ubuntu 镜像预装的 Android SDK（含 sdkmanager），不再调用 setup-android：
          # 该 action 在当前镜像上会执行 sdkmanager --update 并因缺少 `tools` 包而失败
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -z "$SDKM" ]; then
            echo "::error::未找到 sdkmanager（$SDK/cmdline-tools/*/bin/sdkmanager）"
            ls "$SDK" 2>/dev/null || true
            exit 1
          fi
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKM" >> "$GITHUB_OUTPUT"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdkmanager: $SDKM"
          {
            echo "### Android SDK 环境"
            echo "- SDK: \`$SDK\`"
            echo "- sdkmanager: \`$SDKM\`"
            echo "- 已装 NDK: $(ls "$SDK/ndk" 2>/dev/null | paste -sd, -)"
            echo "- 平台: $(ls "$SDK/platforms" 2>/dev/null | paste -sd, -)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install NDK
        shell: bash
        run: |
          set -o pipefail
          SDK="${{ steps.sdk.outputs.sdk }}"
          SDKM="${{ steps.sdk.outputs.sdkmanager }}"
          if [ -d "$SDK/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION 已预装"
          else
            echo "使用 $SDKM 安装 NDK $NDK_VERSION"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -n 20
          fi
          echo "NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "- 使用 NDK: \`$SDK/ndk/$NDK_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          ls "$SDK/ndk/$NDK_VERSION" | head -3

      - name: Write signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 仓库里不存放签名文件，CI 从 Secrets 还原到仓库根目录
          # （build.gradle.kts 里的相对路径 ../../../../lzyrecipe.keystore 正好指向仓库根目录）。
          if [ -z "$KEYSTORE_B64" ]; then
            echo '::warning::未配置 ANDROID_KEYSTORE_BASE64：将使用调试签名，覆盖安装会失败'
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > lzyrecipe.keystore
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          sed -i \
            -e "s/KEYSTORE_PASSWORD/${{ secrets.ANDROID_KEYSTORE_PASSWORD }}/g" \
            -e "s/KEY_ALIAS/${{ secrets.ANDROID_KEY_ALIAS }}/g" \
            -e "s/KEY_PASSWORD/${{ secrets.ANDROID_KEY_PASSWORD }}/g" \
            "$GRADLE"

      - name: Build Android
        id: build
        shell: bash
        run: |
          set -o pipefail
          npx tauri android build --target "$ANDROID_TARGET" 2>&1 | tee build.log
        env:
          CI: 'true'

      - name: Report failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## 构建失败摘要"
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "(没有 build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' ! -name '*-unsigned.apk' | sort | head -n 1)
          if [ -z "$APK" ]; then
            echo '::error::未找到 APK'
            find src-tauri/gen/android/app/build/outputs -type f | head -50
            exit 1
          fi
          VERSION="${{ steps.meta.outputs.version }}"
          NAME="萌厨食光-${VERSION}-arm64-release.apk"
          cp "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME ($(du -h "$NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Package web bundle for hot update
        id: web
        shell: bash
        run: |
          # 前端整包：App 下载它后解压即可升级界面，不需要重新安装 APK
          if [ ! -f dist/index.html ]; then
            echo '::error::dist/index.html 不存在，请确认构建已完成'
            exit 1
          fi
          cd dist
          zip -qr ../web.zip .
          cd ..
          echo "path=web.zip" >> "$GITHUB_OUTPUT"
          echo "web.zip $(du -h web.zip | cut -f1)"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          make_latest: true
          draft: false
          generate_release_notes: true
          body: |
            build-id:${{ steps.meta.outputs.sha }}

            版本 v${{ steps.meta.outputs.version }}（提交 ${{ steps.meta.outputs.sha }}）
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.web.outputs.path }}
