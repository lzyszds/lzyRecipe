name: Android Release

# 打 tag（如 萌厨食光-v0.3.0）或手动触发时，构建 APK 并发布到 GitHub Releases。
# App 内的「检查更新」读取的就是这里的 Releases。
#
# 发布流程：
#   1. 本地执行 npm run android:build -- --bump=patch（或 minor/major）升级版本号
#   2. 提交并推送代码
#   3. 打 tag 并推送：git tag 萌厨食光-v0.3.0 && git push origin 萌厨食光-v0.3.0
#
# 需要在仓库 Secrets 中配置（见 README「应用更新」）：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - '萌厨食光-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（如 萌厨食光-v0.3.0），需与 package.json 版本一致'
        required: true

permissions:
  contents: write

env:
  ANDROID_TARGET: aarch64
  NODE_VERSION: '22'
  NDK_VERSION: '27.0.12077973'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        shell: bash
        run: node scripts/check-version-sync.mjs --tag "${{ steps.meta.outputs.tag }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        shell: bash
        run: |
          # 不通过 setup-android 的 ndk-version 参数安装：它会先执行 sdkmanager --update，
          # 在新版 cmdline-tools 上会因找不到 `tools` 包而失败
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;$NDK_VERSION" "platform-tools" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION" | head -3

      - name: Write signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 仓库里不存放签名文件，CI 从 Secrets 还原到仓库根目录
          # （build.gradle.kts 里的相对路径 ../../../../lzyrecipe.keystore 正好指向仓库根目录）。
          if [ -z "$KEYSTORE_B64" ]; then
            echo '::warning::未配置 ANDROID_KEYSTORE_BASE64：将使用调试签名，覆盖安装会失败'
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > lzyrecipe.keystore
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          sed -i \
            -e "s/KEYSTORE_PASSWORD/${{ secrets.ANDROID_KEYSTORE_PASSWORD }}/g" \
            -e "s/KEY_ALIAS/${{ secrets.ANDROID_KEY_ALIAS }}/g" \
            -e "s/KEY_PASSWORD/${{ secrets.ANDROID_KEY_PASSWORD }}/g" \
            "$GRADLE"

      - name: Build Android
        shell: bash
        run: npx tauri android build --target "$ANDROID_TARGET"
        env:
          CI: 'true'

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' ! -name '*-unsigned.apk' | sort | head -n 1)
          if [ -z "$APK" ]; then
            echo '::error::未找到 APK'
            find src-tauri/gen/android/app/build/outputs -type f | head -50
            exit 1
          fi
          VERSION="${{ steps.meta.outputs.version }}"
          NAME="萌厨食光-${VERSION}-arm64-release.apk"
          cp "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME"

      - name: Package web bundle for hot update
        id: web
        shell: bash
        run: |
          # 前端整包：App 下载它后解压即可升级界面，不需要重新安装 APK
          if [ ! -f dist/index.html ]; then
            echo '::error::dist/index.html 不存在，请确认构建已完成'
            exit 1
          fi
          cd dist
          zip -qr ../web.zip .
          cd ..
          echo "path=web.zip" >> "$GITHUB_OUTPUT"
          echo "web.zip $(du -h web.zip | cut -f1)"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          make_latest: true
          draft: false
          generate_release_notes: true
          body: |
            build-id:${{ steps.meta.outputs.sha }}

            版本 v${{ steps.meta.outputs.version }}（提交 ${{ steps.meta.outputs.sha }}）
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.web.outputs.path }}
